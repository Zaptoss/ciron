syntax = "proto3";

package ciron.v1;

// Common error types for Ciron API

message ErrorDetails {
  ErrorCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_ALREADY_EXISTS = 3;
  ERROR_CODE_INVALID_ARGUMENT = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_TIMEOUT = 6;
  ERROR_CODE_UNAVAILABLE = 7;
  ERROR_CODE_FAILED_PRECONDITION = 8;
  ERROR_CODE_RESOURCE_EXHAUSTED = 9;
}

message ErrorDetail {
  string field = 1;
  string description = 2;
}
